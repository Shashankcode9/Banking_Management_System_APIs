<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submission Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .result {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
<div class="result">
    <h2>Submission Result</h2>
    <p><strong>System msg</strong> <span th:text="${ref}"></span></p>
    <a th:href="@{/credit}">Back to Form</a>
</div>
</body>
</html>
